name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yi adlandir
        run: cp app/build/outputs/apk/release/app-release.apk OyunCevirici.apk

      - name: Surum (Release) olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Oyun Çevirici ${{ github.run_number }}
          body: "Telefona indirmek için aşağıdaki OyunCevirici.apk dosyasına dokun."
          files: OyunCevirici.apk
