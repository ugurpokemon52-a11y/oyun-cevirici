name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imza sifresini kontrol et
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::KEYSTORE_PASS gizli ayari yok. Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - name: APK derle
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleMobilRelease assembleTvRelease --no-daemon --stacktrace

      - name: APK'yi adlandir
        run: |
          cp app/build/outputs/apk/mobil/release/app-mobil-release.apk OyunCevirici-Telefon.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk OyunCevirici-TV.apk

      - name: Surum (Release) olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Oyun Çevirici ${{ github.run_number }}
          body: "Telefona: OyunCevirici-Telefon.apk • TV'ye: OyunCevirici-TV.apk"
          files: |
            OyunCevirici-Telefon.apk
            OyunCevirici-TV.apk
